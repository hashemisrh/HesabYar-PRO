name: Build HesabYar
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Rename shareable release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/HesabYar-1.0.0.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: HesabYar-1.0.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/HesabYar-1.0.0.apk
